<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shiksha Kiran – Admin</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#e8590c;--line:#e5e7eb;--ok:#15803d;--err:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#14110d;--card:#201b15;--ink:#f3ede4;--mut:#a39a8c;--line:#3a322a;--ok:#4ade80;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{margin:0;font-size:1.4rem;color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0}
label{display:block;margin:12px 0 4px;font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.bad{color:var(--err)}
button:disabled{opacity:.6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tag{display:inline-block;font-size:.8rem;background:var(--line);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}
.tag.ok{color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mut{color:var(--mut)}
.msg{margin-top:10px;font-weight:600;color:var(--err)}
.hide{display:none}
a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>Shiksha Kiran Admin</h1><button id="out" class="hide">Log out</button></div>

<div id="login" class="card">
<h3>Admin login</h3>
<form id="fl" novalidate>
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<div class="acts"><button class="pri" type="submit">Log in</button></div>
<div id="lm" class="msg" role="alert"></div>
</form>
</div>

<div id="app" class="hide">
<div class="tabs">
<button data-v="pending" class="on">Pending tutors</button>
<button data-v="approved">Approved tutors</button>
<button data-v="req">Requirements</button>
</div>
<div id="note" class="msg" role="alert"></div>
<div id="list"></div>
</div>
</div>

<script>
(function(){
"use strict";
var BASE="https://ftcrbygzevldpejydglc.supabase.co";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0Y3JieWd6ZXZsZHBlanlkZ2xjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDU2NDksImV4cCI6MjEwMzU4MTY0OX0.hGvYBZA541R_p1jKuRAKFC20kVcKpj6UHIz_P7aCGOc";
var token=null,view="pending";
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function store(k,v){try{if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function load(k){try{return sessionStorage.getItem(k)}catch(e){return null}}

function call(path,method,body){
  var h={apikey:KEY,Authorization:"Bearer "+(token||KEY),"Content-Type":"application/json"};
  if(method&&method!=="GET")h.Prefer="return=minimal";
  return fetch(BASE+path,{method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401){logout("Session expired. Please log in again.");throw new Error("auth")}
    if(!r.ok)throw new Error("Request failed ("+r.status+")");
    return r.text().then(function(t){return t?JSON.parse(t):null});
  });
}
function showApp(on){
  $("login").classList.toggle("hide",on);
  $("app").classList.toggle("hide",!on);
  $("out").classList.toggle("hide",!on);
}
function logout(msg){
  token=null;store("sk_token",null);showApp(false);
  $("lm").textContent=msg||"";$("pw").value="";
}
$("out").addEventListener("click",function(){logout("")});

$("fl").addEventListener("submit",function(ev){
  ev.preventDefault();
  var em=$("em").value.trim(),pw=$("pw").value,btn=ev.target.querySelector("button");
  if(!em||!pw){$("lm").textContent="Enter email and password.";return}
  btn.disabled=true;$("lm").textContent="";
  fetch(BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:em,password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){
      if(!x.ok||!x.j.access_token)throw new Error("bad");
      token=x.j.access_token;store("sk_token",token);start();
    })
    .catch(function(){$("lm").textContent="Wrong email or password."})
    .then(function(){btn.disabled=false});
});

var tabs=document.querySelectorAll(".tabs button");
Array.prototype.forEach.call(tabs,function(b){
  b.addEventListener("click",function(){
    view=b.dataset.v;
    Array.prototype.forEach.call(tabs,function(x){x.classList.toggle("on",x===b)});
    refresh();
  });
});

function act(label,cls,fn){
  var b=el("button",cls,label);
  b.addEventListener("click",function(){
    b.disabled=true;$("note").textContent="";
    fn().then(refresh).catch(function(e){if(e.message!=="auth"&&e.message!=="auth-skip")$("note").textContent="Action failed. Please try again.";b.disabled=false});
  });
  return b;
}
function phoneLink(p){var a=el("a","",p);a.href="tel:"+encodeURIComponent(p);return a}

function refresh(){
  var box=$("list");$("note").textContent="";box.textContent="Loading…";
  var path=view==="req"
    ?"/rest/v1/requirements?select=id,name,phone,subject,levels,area,budget,notes,handled,created_at&order=created_at.desc&limit=200"
    :"/rest/v1/tutors?select=id,name,subject,levels,qual,exp,area,price,phone,status,created_at&status=eq."+view+"&order=created_at.desc&limit=200";
  call(path).then(function(rows){
    box.textContent="";
    if(!rows||!rows.length){box.appendChild(el("p","mut","Nothing here yet."));return}
    rows.forEach(function(r){
      var c=el("div","card");
      c.appendChild(el("h3","",r.name));
      c.appendChild(el("span","tag",r.subject));
      if(r.levels)c.appendChild(el("span","tag",r.levels));
      c.appendChild(el("span","tag",r.area));
      var p=el("div","");p.appendChild(document.createTextNode("Phone: "));p.appendChild(phoneLink(r.phone));c.appendChild(p);
      var acts=el("div","acts");
      if(view==="req"){
        if(r.budget)c.appendChild(el("div","mut","Budget: ₹"+r.budget));
        if(r.notes)c.appendChild(el("div","mut",r.notes));
        c.appendChild(el("span",r.handled?"tag ok":"tag",r.handled?"Handled":"New"));
        acts.appendChild(act(r.handled?"Mark as new":"Mark handled","pri",function(){return call("/rest/v1/requirements?id=eq."+r.id,"PATCH",{handled:!r.handled})}));
        acts.appendChild(act("Delete","bad",function(){return confirm("Delete this requirement?")?call("/rest/v1/requirements?id=eq."+r.id,"DELETE"):Promise.reject(new Error("auth-skip"))}));
      }else{
        var info=[r.qual,r.exp].filter(Boolean).join(" · ");
        if(info)c.appendChild(el("div","mut",info));
        c.appendChild(el("div","","Fee: ₹"+r.price+" / month"));
        if(view==="pending")acts.appendChild(act("Approve","pri",function(){return call("/rest/v1/tutors?id=eq."+r.id,"PATCH",{status:"approved"})}));
        else acts.appendChild(act("Move to pending","",function(){return call("/rest/v1/tutors?id=eq."+r.id,"PATCH",{status:"pending"})}));
        acts.appendChild(act("Delete","bad",function(){return confirm("Delete this tutor permanently?")?call("/rest/v1/tutors?id=eq."+r.id,"DELETE"):Promise.reject(new Error("auth-skip"))}));
      }
      c.appendChild(acts);box.appendChild(c);
    });
  }).catch(function(e){
    if(e.message==="auth")return;
    box.textContent="";
    $("note").textContent="Could not load data. If this is your first login, your email may not be added as admin yet.";
  });
}
function start(){showApp(true);refresh()}
token=load("sk_token");
if(token)start();
})();
</script>
</body>
</html>
